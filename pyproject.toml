[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[project]
name = "data-pipeline"
version = "0.1.0"
description = "Pipeline analítico medallón (dbt + DuckDB) para Pulso"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.7",
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
