name: data_pipeline
version: "0.1.0"
config-version: 2
profile: data_pipeline

model-paths: ["models"]
macro-paths: ["macros", "macros_eval"]
seed-paths: ["seeds"]
test-paths: ["tests"]

vars:
  pipeline_root: "{{ env_var('PIPELINE_ROOT') }}"
  dataset_cutoff: "2026-06-18"  # corte del dataset del reto (rango 2023-06-17..2026-06-17, +1 día por huso)

models:
  data_pipeline:
    silver:
      +schema: silver
      +materialized: table
    quarantine:
      +schema: quarantine
      +materialized: table
    canonical:
      +schema: canonical
      +materialized: table
    gold_restricted:
      +schema: gold_restricted
      +materialized: table
    gold_analytics:
      +schema: gold_analytics
      +materialized: table
    gold_masked:
      +schema: gold_masked
      +materialized: table
    # Zona del evaluador (labels y timeline): solo se construye con --vars build_eval=true y el target eval,
    # que escribe en un eval.duckdb propio. En cualquier otro build estos modelos y sus tests están deshabilitados.
    eval:
      +schema: eval
      +materialized: table
      +enabled: "{{ var('build_eval', false) }}"

seeds:
  data_pipeline:
    +schema: ref
    field_classification:
      +column_types: { tag: varchar, quasi_op: varchar, quasi_width: varchar }
