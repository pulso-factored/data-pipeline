# Sin secretos: solo referencias a variables de entorno.
# threads = 1 a propósito: DuckDB ya paraleliza cada consulta con todos los núcleos, y varios hilos de dbt compiten por
# los mismos núcleos y la misma memoria. Medido: build completo 17m46s con 4 hilos vs 6m18s con 1 (mismo resultado).
# DBT_THREADS lo cambia si algún día hay modelos que no saturen la máquina.
# WAREHOUSE_PATH: archivo local (scratch). PIPELINE_ROOT: ruta local (target dev) o s3://bucket/prefijo (target s3).
# Targets s3/eval_s3 (lago remoto, p. ej. el loader): DuckDB acotado con DUCKDB_MEMORY_LIMIT (def. 2GB) y derrame en
# DUCKDB_TEMP_DIRECTORY (def. $WORK_DIR/duckdb_tmp). Los targets locales no se acotan.
# El target s3 toma las credenciales de la cadena estándar de AWS (rol de la tarea ECS); el runner lo elige solo.
data_pipeline:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', env_var('PIPELINE_ROOT') ~ '/warehouse.duckdb') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | int }}"
    s3:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | int }}"
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '2GB') }}"
        temp_directory: "{{ env_var('DUCKDB_TEMP_DIRECTORY', env_var('WORK_DIR', '.') ~ '/duckdb_tmp') }}"
      extensions:
        - httpfs
      secrets:
        - type: s3
          provider: credential_chain
    # Zona del evaluador: base propia (EVAL_PATH) con el warehouse adjunto en solo lectura para las comprobaciones cruzadas.
    eval:
      type: duckdb
      path: "{{ env_var('EVAL_PATH') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | int }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: wh
          read_only: true
    eval_s3:
      type: duckdb
      path: "{{ env_var('EVAL_PATH') }}"
      threads: "{{ env_var('DBT_THREADS', 1) | int }}"
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '2GB') }}"
        temp_directory: "{{ env_var('DUCKDB_TEMP_DIRECTORY', env_var('WORK_DIR', '.') ~ '/duckdb_tmp') }}"
      extensions:
        - httpfs
      secrets:
        - type: s3
          provider: credential_chain
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: wh
          read_only: true
