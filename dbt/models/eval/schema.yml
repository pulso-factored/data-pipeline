version: 2

models:
  - name: labels
    columns:
      - { name: case_id, data_tests: [unique, not_null] }
      - { name: rank, data_tests: [unique, not_null] }
      - name: split
        data_tests: [{ accepted_values: { arguments: { values: [arranque, reproduccion] } } }]
      - name: language
        data_tests: [{ accepted_values: { arguments: { values: [es, pt] } } }]
  - name: timeline
    columns:
      - { name: case_id, data_tests: [not_null] }
  - name: replay_order
    columns:
      - { name: case_id, data_tests: [unique, not_null] }
